[project]
name = "lowranklatentgmms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gdown>=5.2.0",
    "matplotlib>=3.10.8",
    "numpy<2.0.0",
    "pandas<2.0",
    "pytorch-fid>=0.3.0",
    "scikit-learn>=1.8.0",
    "tabulate>=0.9.0",
    "torch>=2.9.1",
    "torchcfm>=1.0.5",
    "torchvision>=0.24.1",
]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


